name: daily-short

on:
  schedule:
    - cron: "37 15 * * *"   # every day 15:37 UTC (16:37 NL winter time)
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      topic:
        description: "Optional topic override"
        required: false

permissions:
  contents: write

concurrency: daily-short

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Generate (and upload) short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHORTS_LANG: ${{ vars.SHORTS_LANG || 'nl' }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python generate.py --topic "${{ github.event.inputs.topic }}"
          else
            python generate.py
          fi

      - name: Save video for TikTok / Instagram batch
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/final/
          retention-days: 30

      - name: Remember used topic
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add posted.json
          git commit -m "Used topic (run ${{ github.run_number }})" || exit 0
          git push
